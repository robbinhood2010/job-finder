name: Update jobs

on:
  schedule:
    - cron: "0 4 * * *"   # every day at 04:00 UTC (6 AM Cairo, 7 AM Riyadh)
  workflow_dispatch:       # "Run workflow" button for a manual update

permissions:
  contents: write   # only for the monthly keep-alive commit below
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - id: pages
        uses: actions/configure-pages@v6

      - name: Fetch jobs from LinkedIn
        run: python3 update_jobs.py site "${{ steps.pages.outputs.base_url }}/jobs.json"

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v5

      # GitHub pauses daily runs in a repository with no commits for 60 days,
      # so add an empty commit once the last one is 50 days old.
      - name: Keep the daily update alive
        run: |
          last=$(git log -1 --format=%ct)
          if [ $(( $(date +%s) - last )) -gt $(( 50 * 86400 )) ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "Keep the daily job update running"
            git push
          fi
